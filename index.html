<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1945, 해방된 조선의 선택</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ecdc;--paper2:#e9dcc0;--card:#fffaf0;--ink:#2a2119;--muted:#6f6253;
  --red:#b3352b;--red2:#8f261e;--blue:#23467e;--gold:#b98a2e;--green:#2e6a4c;--line:#d3c19c;
}
*{box-sizing:border-box}
html,body{margin:0;background:#1b1815;color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
#app{max-width:1040px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.5)}
/* header */
#top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#2a2119;color:#f4ecdc;position:sticky;top:0;z-index:20}
#top .logo{font-family:'Noto Serif KR',serif;font-weight:900;font-size:16px;white-space:nowrap}
#top .brand{display:flex;flex-direction:column;line-height:1.2}
#top .maker{font-size:10.5px;color:#a8977c;white-space:nowrap;margin-top:2px;letter-spacing:.02em}
#top .part{flex:1;min-width:0;font-size:13px;color:#d9c9a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .part b{color:#fff;font-weight:700}
#top .dots{display:flex;gap:5px}
#top .dots i{width:9px;height:9px;border-radius:50%;background:#5b4d3f;display:block}
#top .dots i.done{background:#b98a2e}
#top .dots i.now{background:#e8574b;box-shadow:0 0 0 3px rgba(232,87,75,.3)}
#top .ibtn{background:#43372c;color:#f4ecdc;border:0;border-radius:8px;padding:7px 10px;font-size:13px;white-space:nowrap}
#top .ibtn:hover{background:#584838}
#stage{flex:1;display:flex;flex-direction:column}
/* visual */
.vis{position:relative;width:100%;aspect-ratio:800/360;max-height:46vh;overflow:hidden;background:#000;flex-shrink:0}
.vis svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tags{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:3}
.tag{background:rgba(255,250,240,.92);border:1.5px solid var(--ink);border-radius:99px;padding:3px 11px;font-size:13px;font-weight:700}
.chars{position:absolute;inset:0;pointer-events:none;z-index:2}
.ch{position:absolute;bottom:7%;display:flex;flex-direction:column;align-items:center;transition:opacity .3s,filter .3s,transform .3s;animation:pop .5s both}
.ch.l{left:9%}.ch.r{right:9%}.ch.c{left:50%;transform:translateX(-50%)}
.ch .face{width:clamp(62px,11vw,108px);aspect-ratio:1;border-radius:50%;background:var(--c);color:#fff8e6;display:grid;place-items:center;border:4px solid #fff8e6;box-shadow:0 6px 16px rgba(0,0,0,.35);font-family:'Noto Serif KR',serif;font-weight:900;transition:transform .3s}
.ch .face span{font-size:clamp(20px,3.4vw,34px);line-height:1}
.ch .face.len3 span{font-size:clamp(15px,2.5vw,25px)}
.ch .nm{margin-top:6px;background:#fff8e6;border:1.5px solid var(--ink);border-radius:99px;padding:2px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.ch.dim{opacity:.5;filter:grayscale(.6)}
.ch.on .face{transform:scale(1.1)}
/* 인물 사진 */
.face{position:relative;overflow:hidden}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;background:#d8ccb4}
@keyframes pop{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
/* panel */
.panel{padding:18px 20px 26px;flex:1;display:flex;flex-direction:column;gap:14px}
.dlg{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px 20px 18px;min-height:112px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);font-size:clamp(17px,2.1vw,20px);line-height:1.65;user-select:none}
.dlg.nar{background:#2f2721;color:#f4ecdc;border-color:#2f2721;box-shadow:4px 4px 0 #8a7556;font-family:'Noto Serif KR',serif}
.dlg .who{position:absolute;top:-15px;left:16px;background:var(--c);color:#fff;font-weight:700;font-size:14px;padding:3px 14px;border-radius:99px;border:2px solid var(--ink)}
.dlg .more{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--muted);animation:blink 1.2s infinite}
.dlg.nar .more{color:#cbb894}
.recon{font-size:12.5px;color:var(--muted);margin-top:-4px}
@keyframes blink{50%{opacity:.25}}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:16px;padding:11px 22px;border-radius:12px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.big{font-size:20px;padding:14px 34px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{box-shadow:none;border-color:var(--line);background:transparent;font-size:14px;padding:8px 14px}
/* question */
.q{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.qlabel{display:inline-block;background:var(--ink);color:#f4ecdc;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;margin-bottom:8px;letter-spacing:.02em}
.qlabel.write{background:var(--red)}
.q h3{margin:0 0 14px;font-family:'Noto Serif KR',serif;font-size:clamp(19px,2.5vw,24px);line-height:1.45}
.q .lead{font-size:15px;color:var(--muted);margin:-6px 0 12px;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(16px,2vw,18px);font-weight:500;color:var(--ink);min-height:58px;transition:all .15s}
.opt:hover{border-color:var(--ink);background:#fff7e6}
.opt .num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-weight:900;font-size:15px}
.opt.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.sel .num{background:var(--red);color:#fff}
.opt.big{justify-content:center;font-size:22px;font-weight:900;font-family:'Noto Serif KR',serif;min-height:68px}
.reason{margin-top:16px;padding-top:14px;border-top:2px dashed var(--line);animation:pop .35s both}
.hidden{display:none!important}
.mine{font-size:15px;margin-bottom:10px}
.mine b{background:#fde7c4;padding:2px 8px;border-radius:6px}
.reason label{display:block;font-weight:900;font-size:17px;margin-bottom:8px}
.reason label small{font-weight:500;color:var(--muted);font-size:15px;margin-left:6px}
.reason input,.sent input{width:100%;font-size:18px;padding:13px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-family:inherit;color:var(--ink)}
.reason input:focus,.sent input:focus{outline:3px solid #f0b85a;outline-offset:1px}
.sent{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:18px;line-height:1.6;font-family:'Noto Serif KR',serif;font-weight:700}
.sent input{flex:1 1 230px;width:auto;font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:17px;padding:10px 12px}
.sent .fixed{background:#fde7c4;padding:2px 8px;border-radius:6px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hints button{border:1.5px dashed var(--muted);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;color:var(--ink)}
.hints button:hover{border-style:solid;background:#fff7e6}
/* history */
.hist{background:#fff6df;border:2px solid var(--ink);border-left:10px solid var(--gold);border-radius:14px;padding:18px 20px;box-shadow:4px 4px 0 var(--ink);font-size:17px;line-height:1.75;animation:pop .4s both}
.hhead{font-family:'Noto Serif KR',serif;font-weight:900;font-size:21px;margin-bottom:10px}
.cmp{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;margin-bottom:12px}
.chip{display:inline-block;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;margin-right:4px}
.hrow{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:start}
.hrow:last-of-type{border-bottom:0}
.hrow .lb{font-size:12.5px;font-weight:900;background:var(--paper2);border-radius:6px;padding:3px 6px;text-align:center;margin-top:3px}
.hrow.mine-r .lb{background:var(--ink);color:#fff}
.hrow.real .lb{background:var(--blue);color:#fff}
.verdict{margin-top:12px;background:#eaf3ec;border-radius:10px;padding:10px 12px;font-size:16px;font-weight:500}
.key{margin-top:14px;text-align:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(20px,2.8vw,27px);color:var(--red2);padding:12px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:#fffaf0}
.common{margin-top:14px;background:#2f2721;color:#f4ecdc;border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.7;font-weight:500}
.common b{color:#f0c46b}
ol.cond{margin:8px 0 0;padding-left:24px}
ol.cond li{margin:2px 0}
ul.fact{margin:4px 0 0;padding-left:20px}
ul.fact li{margin:3px 0}
/* terms */
.term{border-bottom:2px dotted var(--gold);cursor:help;font-weight:700}
.dlg.nar .term{border-color:#e0b860}
#pop{position:fixed;z-index:60;max-width:300px;background:#2a2119;color:#f4ecdc;padding:11px 14px;border-radius:10px;font-size:14px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
#pop b{color:#f0c46b;display:block;margin-bottom:2px}
/* prologue */
.pro{flex:1;min-height:calc(100vh - 52px);background:#000;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;padding:20px}
.pro .date{font-family:'Courier New',monospace;font-size:clamp(40px,8vw,84px);letter-spacing:.08em;color:#f2e6cc}
.pro .tap{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;color:#9a8f7e;animation:blink 1.4s infinite}
.news{background:#ece2c8;color:#111;width:min(580px,92%);padding:18px 24px 22px;border:1px solid #6d5f45;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-2deg);animation:drop .7s cubic-bezier(.2,1.4,.4,1) both;font-family:'Noto Serif KR',serif}
.news .mast{display:flex;justify-content:space-between;align-items:center;border-bottom:4px double #111;padding-bottom:6px;margin-bottom:12px;font-size:14px}
.news .mast b{font-size:30px;font-weight:900;letter-spacing:.2em}
.news h1{margin:4px 0 10px;font-size:clamp(34px,6.5vw,58px);line-height:1.15;font-weight:900;text-align:center}
.news p{margin:0;font-size:15px;border-top:1px solid #111;padding-top:8px;text-align:center}
@keyframes drop{from{opacity:0;transform:scale(1.6) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(-2deg)}}
.pvis{width:min(900px,100%);aspect-ratio:800/360;position:relative;border-radius:8px;overflow:hidden;animation:fade 1s both}
.pvis svg{width:100%;height:100%;display:block}
.pnar{margin-top:22px;font-family:'Noto Serif KR',serif;font-size:clamp(19px,3vw,28px);min-height:1.6em;text-align:center;line-height:1.6}
.pnar2{font-family:'Noto Serif KR',serif;font-size:clamp(22px,3.6vw,34px);text-align:center}
.bigq{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(36px,7vw,70px);text-align:center;line-height:1.3;margin:0 0 34px;color:#fff;animation:fade 1.2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* part card */
.pcard{text-align:center;max-width:720px;animation:fade 1s both}
.pcard .pk{font-family:'Courier New',monospace;color:#e8a86a;letter-spacing:.2em;font-size:16px}
.pcard h2{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(32px,6vw,56px);margin:8px 0 14px;color:#fff}
.pcard p{font-size:clamp(16px,2.4vw,20px);line-height:1.7;color:#d9c9a8;margin:0 0 26px;font-family:'Noto Serif KR',serif}
.coreq{display:inline-block;border:1.5px solid #6b5a45;border-radius:12px;padding:10px 16px;font-size:clamp(14px,2vw,17px);color:#f4ecdc;font-family:'Noto Serif KR',serif;background:rgba(255,255,255,.04)}
.coreq small{display:block;color:#a8977c;font-size:12px;margin-bottom:2px;font-family:'Noto Sans KR',sans-serif}
/* full pages */
.full{padding:26px 22px 34px;display:flex;flex-direction:column;gap:18px;flex:1}
.ttl .kicker{font-size:13px;font-weight:900;color:var(--red);letter-spacing:.08em}
.ttl h2{margin:4px 0 6px;font-family:'Noto Serif KR',serif;font-size:clamp(26px,4vw,38px);font-weight:900;line-height:1.3}
.ttl p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}
/* intro */
.intro{background:radial-gradient(ellipse at top,#3b2f25,#1b1612);color:#f4ecdc;flex:1;min-height:calc(100vh - 52px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center;gap:20px}
.intro .flag{width:120px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.intro h1{margin:0;font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(38px,7vw,64px);letter-spacing:.02em}
.intro .sub{font-family:'Noto Serif KR',serif;font-size:clamp(17px,2.6vw,22px);color:#e6cf9f}
.steps5{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:720px}
.steps5 span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:6px 12px;font-size:14px}
.steps5 em{font-style:normal;color:#e8a86a;margin:0 2px}
.namebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.namebox input{font-size:17px;padding:11px 14px;border-radius:10px;border:2px solid #8a7556;background:#fffaf0;width:230px;font-family:inherit}
.intro .note{font-size:13px;color:#a8977c;line-height:1.7}
.resume{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:14px;color:#e6cf9f}
/* source */
.src{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.orig{background:#efe4c6;border:1px solid #8a7556;padding:20px 22px;font-family:'Noto Serif KR',serif;font-size:16px;line-height:1.9;box-shadow:inset 0 0 40px rgba(120,90,40,.25),4px 4px 0 var(--ink);position:relative}
.orig h4{margin:0 0 4px;text-align:center;font-size:20px;font-weight:900}
.orig .src-meta{text-align:center;font-size:13px;color:#5d4f3a;margin-bottom:12px}
.orig p{margin:0 0 8px}
.orig mark{background:linear-gradient(transparent 55%,#f3c76a 55%);color:inherit}
.orig.pickable mark{cursor:pointer;border-radius:3px;transition:background .15s}
.orig.pickable mark:hover{background:#f3c76a}
.orig.pickable mark.on{background:#e8574b;color:#fff;box-shadow:0 0 0 2px #e8574b}
.orig .cut{color:#7b6a50;font-size:13px}
.easy{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.easy h4{margin:0 0 10px;font-size:18px}
.easy ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.easy li{font-size:16px;line-height:1.6;padding-left:44px;position:relative}
.easy li b{position:absolute;left:0;top:1px;background:var(--blue);color:#fff;font-size:12px;padding:2px 6px;border-radius:5px}
.easy .sum{margin-top:14px;background:#fde7c4;border-radius:10px;padding:10px 12px;font-weight:700;font-size:16px;line-height:1.6}
.step{display:inline-block;background:var(--blue);color:#fff;font-size:12px;font-weight:900;padding:2px 8px;border-radius:5px;margin-right:6px}
/* meet / select */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pc{perspective:900px;min-height:270px;cursor:pointer;background:none;border:0;padding:0;text-align:center;color:var(--ink)}
.pc .in{position:relative;width:100%;height:100%;min-height:270px;transition:transform .6s;transform-style:preserve-3d}
.pc.flip .in{transform:rotateY(180deg)}
.pc .fr,.pc .bk{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px}
.pc .fr{background:var(--card)}
.pc .bk{background:var(--c);color:#fff;transform:rotateY(180deg)}
.pc .face{width:96px;height:96px;border-radius:50%;background:var(--c);color:#fff8e6;display:grid;place-items:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:26px;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.pc .face.len3{font-size:21px}
.pc .nm{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:900}
.pc .sb{font-size:13px;color:var(--muted);line-height:1.5}
.pc .tp{font-size:13px;color:var(--red);font-weight:700}
.pc .qt{font-family:'Noto Serif KR',serif;font-size:18px;line-height:1.6}
.pc .kw{background:#fff;color:var(--ink);font-weight:900;font-size:20px;padding:6px 16px;border-radius:99px}
.sel3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sc{background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:all .15s;color:var(--ink)}
.sc:hover{transform:translateY(-3px)}
.sc.on{background:var(--c);color:#fff;transform:translateY(-4px);box-shadow:6px 6px 0 var(--ink)}
.sc .face{width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff8e6;display:grid;place-items:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;border:4px solid #fff}
.sc .face.len3{font-size:19px}
.sc .nm{font-size:15px;font-weight:700}
.sc .path{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:900;line-height:1.4}
.sc .kws{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.sc .kws span{border:1.5px solid currentColor;border-radius:99px;padding:1px 9px;font-size:12.5px;font-weight:700}
.sc .done{font-size:12px;background:var(--gold);color:#fff;border-radius:6px;padding:2px 8px}
.cnt{font-size:14px;color:var(--muted);font-weight:700}
.notice{background:#2f2721;color:#f4ecdc;border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.75;box-shadow:4px 4px 0 #8a7556}
.notice b{color:#f0c46b;font-size:17px}
/* reflect */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>div{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;font-size:16px;line-height:1.7;box-shadow:3px 3px 0 var(--ink)}
.two h4{margin:0 0 6px;font-size:16px}
/* timeline */
.tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.tl:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:3px;background:var(--line)}
.tl div{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.55}
.tl div:before{content:'';position:absolute;left:-21px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--line);border:2px solid var(--paper)}
.tl div b{display:inline-block;min-width:92px;color:var(--muted)}
.tl div.hl{border-color:var(--ink);background:#fff3d8;font-weight:700}
.tl div.hl:before{background:var(--red)}
.tl div.end{border-color:var(--ink);background:#2a2119;color:#f4ecdc}
.tl div.end b{color:#e6cf9f}
.fate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fate div{border:2px solid var(--c);border-radius:12px;padding:12px;background:#fff;font-size:14px;line-height:1.6}
.fate div b{display:block;color:var(--c);font-size:16px;margin-bottom:2px}

<script>
/* =====================================================================
   [v10 변경 내역] PART 4를 '정답 맞히기'가 아닌 '역사적 판단 → 비교' 활동으로
   - (선생님이 직접 고친 포고령 날짜 9월 9일, 제2조 정답 선택지는 그대로 유지)
   - 선택지 아래 사건명·조직명(→ ○○ 선포 등) 삭제. 선택 전에는 실제 역사를 알 수 있는 단서 없음
   - 실제 역사 속 선택의 위치를 문항마다 ①/② 로 나눔 (ri 값, 화면에는 선택 뒤에만 사용)
   - 두 선택지를 모두 그럴듯한 가치 충돌로 다시 씀 (원칙↔현실, 즉각 행동↔준비, 자주↔협력 등)
   - 선택 뒤 흐름: 나의 선택 → 🤔 이 선택을 한다면? (잠깐 생각) → 두 선택의 '가능성'과 '어려움'
                   → 실제 역사에서는? → 비교해 보기
   - '좋은 점/한계' → '이 선택이 가져올 가능성 / 이 선택이 안고 있는 어려움'
   - 인물 카드의 노선 키워드(통일·자주 등)를 1945년 당시의 위치 설명으로 바꿈
   - ④ 시작 '잠깐!' 안내, ③→④ 전환 질문, ⑤ Q1의 '실제 역사 → 그렇다면 나는?' 문구 다듬기
   ===================================================================== */
/* =====================================================================
   [v9 변경 내역] PART 3→4→5 연결과 역사적 사고 강화 (분량은 거의 그대로)
   - ③→④ 전환 장면(R.photo) 끝에 '광복은 끝이 아니었다…' 한 줄과 '내가 이 시대에 산다면 어떤 길을?' 질문
   - ④ 시작 안내: 인물 = 하나의 노선으로 단순화하지 않기
   - ④ 선택지에서 ＋장점/－한계를 빼고, 선택한 뒤 「그 선택을 했다면」에서 확인
     → 「실제 역사에서는?」은 버튼을 눌러 확인 (나의 선택 → 그 선택을 했다면 → 실제 역사에서는?)
   - ④ 세 딜레마에 단계 표시: ① 나·우리 조직의 선택 → ② 정치 세력 사이의 선택 → ③ 새 나라를 만드는 선택 (상황 문장 일부 조정)
   - ⑤ Q1: 선택한 인물의 실제 선택(기존 routeEnd·실제 역사 내용 재활용)을 먼저 보여 준 뒤 동의 여부와 근거
   - ⑤ Q2: 힌트는 버튼을 눌렀을 때만 하나씩 표시
   - 기록 화면 끝 마무리 문장, 맥아더 포고령 근거 표시를 형광펜 느낌으로
   ===================================================================== */
/* =====================================================================
   [v8 변경 내역] 부분 수정
   1. 호외 장면 뒷사진(.newsbg)만 조금 더 선명하게 (opacity .18 → .34)
   2. 만세 장면 현수막 '조선 독립 만세' → '대한 독립 만세'
   3. 맥아더 포고령 사료: 답의 근거 표현에 건준 강령과 같은 점선 밑줄(.ev)
   4. 포고령 Q1 정답 해설에 '더글러스 맥아더(맥아더 장군)' 설명 추가
   5. 상단 header에 '제작: 이태형T(한백고)' 작게 표시 (모바일은 header 맨 아래 한 줄)
   6. 배경 사진: 사진이 다 불러와지면 기존 SVG를 즉시 숨기고 사진 표시 (photoReady) → 겹쳐 보이지 않음
   7. 마지막 질문 1: 'PART 4에서 내가 걸은 인물의 선택'에 동의하는지와 이유를 묻는 문항으로 변경
   8. PART 4 난이도: 선택 전 '당시 상황' 카드(sit), 장면 대사·선택지를 쉬운 말로, 선택지 아래 관련 용어(term) 작게 표시
      (딜레마·선택지 수·장점/한계·선택 결과·실제 역사 비교 구조는 그대로)
   ===================================================================== */
/* =====================================================================

function fmt(raw){
  return raw.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
            .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>{const k=b||a;return `<span class="term" data-k="${k}">${a}</span>`});
}
function plain(raw){
  return raw.replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g,'$1').replace(/\*\*/g,'').replace(/<[^>]+>/g,'');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
/* 받침에 따라 조사 고르기: josa('치안','이','가') → '이' */
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return a;return (c-0xAC00)%28?a:b}

let AC=null;
function audioInit(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tick(){
  if(S.muted||!AC) return;
  try{
    const len=AC.sampleRate*0.025, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
    const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800;
    const g=AC.createGain(); g.gain.value=0.22; s.connect(f).connect(g).connect(AC.destination); s.start();
  }catch(e){}
}
function tone(freqs,dur=0.18,type='sine',vol=0.12){
  if(S.muted||!AC) return;
  try{ freqs.forEach((fq,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=fq;
    const t=AC.currentTime+i*dur; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+dur*1.6);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur*1.7); }); }catch(e){}
}

let ACTIVE=[];
function fadeTo(a,to,ms,done){
  clearInterval(a._f);
  if(ms<=0){a.volume=to;done&&done();return}
  const from=a.volume, steps=Math.max(1,Math.round(ms/40)); let i=0;
  a._f=setInterval(()=>{i++; a.volume=Math.max(0,Math.min(1,from+(to-from)*i/steps)); if(i>=steps){clearInterval(a._f);done&&done()}},40);
}
function playFile(key,o){
  const a=new Audio(SND_FILES[key]); a.loop=!!o.loop; a.volume=0; a.preload='auto';
  let failed=false; const fail=()=>{ if(failed) return; failed=true; ACTIVE=ACTIVE.filter(x=>x!==h); o.onerror&&o.onerror(); };
  const h={stop:(ms=300)=>{ fadeTo(a,0,ms,()=>a.pause()); ACTIVE=ACTIVE.filter(x=>x!==h); }};
  a.addEventListener('error',fail);
  a.addEventListener('ended',()=>{ ACTIVE=ACTIVE.filter(x=>x!==h); o.onend&&o.onend(); });
  const p=a.play(); if(p&&p.catch) p.catch(fail);
  fadeTo(a,o.vol==null?1:o.vol,o.fadeIn||200);
  if(o.fadeOutAfter) setTimeout(()=>h.stop(2500),o.fadeOutAfter);
  return h;
}
function webStop(g,nodes){ return (ms=300)=>{ try{ const t=AC.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+ms/1000+.01); nodes.forEach(n=>n.stop(t+ms/1000+.05)); }catch(e){} }; }
/* 코드로 만든 소리: 옛 라디오 잡음 */
function genStatic(o){
  if(!AC) return null;
  const len=AC.sampleRate*2, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(Math.random()<0.003?1:0.3);
  const src=AC.createBufferSource(); src.buffer=b; src.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2000; bp.Q.value=.7;
  const g=AC.createGain(); g.gain.value=0; src.connect(bp).connect(g).connect(AC.destination); src.start();
  g.gain.linearRampToValueAtTime(0.1*(o.vol==null?1:o.vol),AC.currentTime+.4);
  return {stop:webStop(g,[src])};
}
/* 코드로 만든 소리: 시계 초침 */
function genClock(o){
  let n=0; const id=setInterval(()=>{ if(S.muted||!AC) return; n++; tone([n%2?2100:1700],0.015,'square',0.025*(o.vol==null?1:o.vol)); },1000);
  return {stop:()=>clearInterval(id)};
}
/* 코드로 만든 소리: 전쟁 막바지의 낮은 긴장음 */
function genDrone(o){
  if(!AC) return null;
  const g=AC.createGain(); g.gain.value=0; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220;
  const os=[55,55.7,82.4].map(fq=>{const x=AC.createOscillator(); x.type='sine'; x.frequency.value=fq; x.connect(lp); x.start(); return x});
  lp.connect(g).connect(AC.destination); g.gain.linearRampToValueAtTime(0.035*(o.vol==null?1:o.vol),AC.currentTime+4);
  return {stop:webStop(g,os)};
}
const GEN={static:genStatic,clock:genClock,drone:genDrone};
function play(key,o={}){
  const none={stop(){}};
  if(S.muted){ o.onerror&&o.onerror(); return none; }
  audioInit();
  let h=null;
  if(GEN[key]) h=GEN[key](o); else if(SND_FILES[key]) h=playFile(key,o);
  if(!h){ o.onerror&&o.onerror(); return none; }
  ACTIVE.push(h); return h;
}
/* cue: 'key' 또는 {k:'key', delay, vol, loop, fadeOutAfter} 또는 그 배열 */
function cue(c){
  if(!c) return; if(Array.isArray(c)) return c.forEach(cue);
  const o=typeof c==='string'?{k:c}:Object.assign({},c);
  if(o.delay){ const my=idx; setTimeout(()=>{ if(idx===my) play(o.k,o); },o.delay); } else play(o.k,o);
}
function stopAll(ms=300){ ACTIVE.slice().forEach(h=>h.stop(ms)); ACTIVE=[]; }

let T=null;
function typeText(el,raw,done,sp=30){
  if(T) T.stop();
  const txt=plain(raw); let i=0; el.textContent='';
  const id=setInterval(()=>{ i++; el.textContent=txt.slice(0,i); if(i%3===1) tick(); if(i>=txt.length) fin(); },sp);
  function fin(){ clearInterval(id); el.innerHTML=fmt(raw); T=null; done&&done(); }
  T={stop:()=>clearInterval(id),finish:fin};
}

  for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];

/* ================= 기록 ================= */
function rec(id,o){ if(!S.rec[id]) S.order.push(id); S.rec[id]=o; save(); }
function recLine(r){ return r.sentence ? `<b>${esc(r.choice)}</b> <i>— ${esc(r.sentence)}</i>` : `<b>${esc(r.choice)}</b>${r.reason?` <i>— ${esc(r.reason)}</i>`:''}`; }
function recHTML(){
  if(!S.order.length) return '<p class="empty">아직 기록이 없어요. 선택하고 생각을 적으면 여기에 쌓여요.</p>';
  return S.order.map(id=>{const r=S.rec[id];return `<div><small>${esc(r.label)}</small>${recLine(r)}</div>`}).join('');
}
$('#recBtn').onclick=()=>{$('#drList').innerHTML=recHTML();$('#drawer').classList.add('open')};
$('#drClose').onclick=()=>$('#drawer').classList.remove('open');

/* ================= 흐름 ================= */
let flow=[], idx=0;
function updateTop(st){
  const p=st.part;
  $('#partLabel').innerHTML = p==null? `<b>${CORE_Q}</b>` : `PART ${p+1} · <b>${PARTS[p]}</b>`;
  $('#dots').innerHTML=PARTS.map((_,i)=>`<i class="${p==null?'':i<p?'done':i===p?'now':''}" title="PART ${i+1} ${PARTS[i]}"></i>`).join('');
}
function go(i){
  if(T){T.stop();T=null}
  idx=Math.max(0,Math.min(i,flow.length-1)); const st=flow[idx]; updateTop(st);
  $('#pop').style.display='none';
  if(!st.keep) stopAll(300); /* [v4] */
  stage.innerHTML=''; R[st.t](st);
  window.scrollTo({top:0});
  if(idx>0) save();
}
function next(){ go(idx+1); }
function rebuildFlow(){ flow = COMMON.slice(); if(S.route) flow = flow.concat(buildRoute(S.route), ENDING); }

/* [v4] 장면 배경에 깔 사진 이름 (images/이름.jpg) */
function bgPhotoKey(st){
  if(st.bg==='street') return st.cheer?'bg_cheer':'bg_street';
  if(st.bg==='room') return st.night?'bg_room_night':'bg_room';
  return ({gov:'bg_gov',office:'bg_office',rally:'bg_rally',ballot:'bg_ballot',dawn:'bg_dawn'})[st.bg]||'';
}
function photoLayer(key){ return key?`<img class="bgphoto" src="images/${key}.jpg" alt="" onerror="this.remove()" onload="photoReady(this,'${key}')">`:''; }
/* [v8] 사진이 준비되면 같은 칸의 기존 SVG 그림을 즉시 숨기고 사진을 보여 줌 */
function photoReady(img,key){ const box=img.parentElement; if(box) [...box.children].forEach(el=>{ if(el.tagName.toLowerCase()==='svg') el.style.display='none'; }); img.classList.add('ready'); showCredit(img,key); }
function frame(st){
  const chars=(st.chars||[]).map(c=>{const C=CH[c.k];return `<div class="ch ${c.p}" data-k="${c.k}" style="--c:${C.c}"><div class="face ${faceCls(C.h)}">${faceInner(C)}</div><div class="nm">${C.n}</div></div>`}).join('');
  stage.innerHTML=`<div class="vis">${(BG[st.bg]||BG.none)(st)}${photoLayer(bgPhotoKey(st))}<div class="tags">${st.place?`<span class="tag">📍 ${fmt(st.place)}</span>`:''}${st.date?`<span class="tag">🗓 ${st.date}</span>`:''}</div><div class="chars">${chars}</div></div><div class="panel" id="panel"></div>`;
  return $('#panel');
}
function speak(k){ $$('.ch').forEach(e=>{e.classList.toggle('on',!!k&&e.dataset.k===k);e.classList.toggle('dim',!!k&&e.dataset.k!==k)}); }
function nextBtn(label='다음 ▶',dis=false){return `<div class="actions"><button class="btn primary" id="nx" ${dis?'disabled':''}>${label}</button></div>`}
function hasHist(st){ return (st.lines||[]).some(L=>L.who&&CH[L.who].hist); }

/* 한 문장 쓰기 블록: pre [입력] post */
function sentHTML(pre,post,ph,id='why'){
  return `<div class="sent">${pre?`<span>${pre}</span>`:''}<input id="${id}" maxlength="80" autocomplete="off" placeholder="예) ${esc(ph||'')}">${post?`<span>${post}</span>`:''}</div>`;
}

R.scene=st=>{
  const p=frame(st); let li=0, done=false; const note=hasHist(st);
  cue(st.amb); /* [v4] 장면 소리 */
  function show(){
    const L=st.lines[li], last=li===st.lines.length-1; const C=L.who?CH[L.who]:null;
    speak(L.who||null);
    if(L.cut) stopAll(0); cue(L.sfx); if(L.cards) showCards(L.cards); /* [v4] 대사별 소리·카드 */
    p.innerHTML=`<div class="dlg ${C?'':'nar'}" data-adv="1">${C?`<div class="who" style="--c:${C.c}">${C.n}</div>`:''}<div class="txt"></div><div class="more"></div></div>${note?`<div class="recon">${RECON}</div>`:''}${last?nextBtn('다음 ▶',true):''}`;
    const dlg=p.querySelector('.dlg'); done=false;
    typeText(dlg.querySelector('.txt'),L.text,()=>{done=true; if(last){const b=$('#nx');b.disabled=false;b.onclick=next;dlg.removeAttribute('data-adv');speak(null)} else dlg.querySelector('.more').textContent='눌러서 계속 ▼'});
    dlg.onclick=e=>{ if(e.target.closest('.term')) return; if(T){T.finish();return} if(done&&!last){li++;show()} };
  }
  show();
};

/* 선택 장면: 기본은 클릭만. write가 있으면 핵심 서술 활동(한 문장) */
const NUMS='①②③④⑤', ABC='ABCD';
R.choice=st=>{
  const p=frame(st); speak(null);
  const mk=st.abc?ABC:NUMS; const W=st.write;
  p.innerHTML=`<div class="q"><div class="qlabel ${W?'write':''}">${st.label}</div>${st.situation?`<div class="lead">${fmt(st.situation)}</div>`:''}${st.stage?`<div class="stagebar">${STAGES.map((t,i)=>`<span class="${i+1===st.stage?'on':i+1<st.stage?'done':''}">${NUMS[i]} ${t}</span>`).join('<em>→</em>')}</div>`:''}${st.sit?`<div class="sitcard"><b>📍 당시 상황</b>${fmt(st.sit)}</div><div class="sitnext">🤔 당신 앞에 놓인 선택</div>`:''}<h3>${fmt(st.q)}</h3>
    <div class="opts ${st.abc?'one':''}">${st.opts.map((o,i)=>`<button class="opt ${st.big?'big':''}" data-i="${i}">${st.big?'':`<span class="num">${mk[i]}</span>`}<span>${fmt(o)}</span></button>`).join('')}</div>
    ${W?`<div class="reason hidden"><label>✏️ ${W.lead}</label><div id="sentBox"></div><div class="hint">빈칸만 채우면 돼요. 짧게 써도 괜찮아요. (2글자 이상)</div></div>`:''}</div>${nextBtn('다음 ▶',true)}`;
  let pick=-1; const nx=$('#nx'); const prev=S.rec[st.id];
  const short=i=>st.short?st.short[i]:plain(st.opts[i]);
  const check=()=>{ const inp=$('#why'); nx.disabled = !(pick>=0 && (!W || (inp && inp.value.trim().length>=2))); };
  const choose=(i,keep)=>{
    pick=i; $$('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));
    if(W){
      const old=$('#why')?$('#why').value:(keep||'');
      p.querySelector('.reason').classList.remove('hidden');
      $('#sentBox').innerHTML=sentHTML(W.pre(short(i)),W.post,W.ph);
      const inp=$('#why'); inp.value=old; inp.oninput=check;
      inp.onkeydown=e=>{if(e.key==='Enter'&&!nx.disabled) nx.click()};
    }
    check();
  };
  $$('.opt').forEach(b=>b.onclick=e=>{ if(e.target.closest('.term')) return; tick(); choose(+b.dataset.i); if(W) setTimeout(()=>$('#why')?.focus(),50); });
  if(prev) choose(prev.i, prev.reason);
  nx.onclick=()=>{
    const o={label:st.label,choice:st.short?st.short[pick]:plain(st.opts[pick]),short:short(pick),i:pick};
    if(W){ o.reason=$('#why').value.trim(); o.sentence=plain(`${W.pre(short(pick))} ${o.reason} ${W.post||''}`).trim(); }
    rec(st.id,o); chime(); next();
  };
};

/* 실제 역사에서는? — 나의 판단 / 역사적 맥락 / 역사적 사실 / 실제 인물의 선택 / 핵심 생각 */
R.history=st=>{
  const p=frame(st); speak(null);
  const r=st.ref?S.rec[st.ref]:null;
  const row=(cls,lb,html)=>`<div class="hrow ${cls}"><span class="lb">${lb}</span><div>${html}</div></div>`;
  let rows='';
  const w=String(r?(r.short||r.choice):'').replace(/[.。]$/,'');
  if(r) rows+=row('mine-r','나의 선택', st.mine? st.mine(r) : `나는 「${esc(w)}」${josa(w,'을','를')} 선택했다.`);
  if(st.ctx) rows+=row('','역사적 맥락',fmt(st.ctx));
  if(st.fact) rows+=row('',st.factLabel||'역사적 사실',fmt(st.fact)); /* [v3] factLabel 선택 항목 추가 */
  if(r&&st.res&&st.res[r.i]) rows+=row('res','그 선택을 했다면',st.res[r.i]); /* [v5][v9] */
  if(st.dlr&&r){ /* [v10] 나의 선택 → 이 선택을 한다면? → 가능성·어려움 → 실제 역사 → 비교 */
    const D=st.dlr, ord=[r.i,1-r.i], nm=CH[st.who].n, cut=t=>String(t).replace(/[.。]$/,'');
    const cards=`<div class="pc2">${ord.map(i=>`<div class="pcard2 ${i===r.i?'me':''}"><small>${i===r.i?'내가 고른 길':'다른 길'}</small><b>${D[i].t}</b><div class="pros">✦ 이 선택이 가져올 가능성<br>${D[i].pro}</div><div class="cons">✦ 이 선택이 안고 있는 어려움<br>${D[i].con}</div></div>`).join('')}</div>`;
    const cmp = st.ri==null ? `실제로 ${nm}${josa(nm,'은','는')} 두 가지를 함께 추진했어요. 나는 그중 「${esc(cut(D[r.i].t))}」 쪽에 더 무게를 두었어요.`
      : st.ri===r.i ? `나도 실제 ${nm}${josa(nm,'과','와')} <b>같은 쪽</b>을 골랐어요. 그 길이 어떤 어려움을 안고 있었는지 위에서 다시 살펴보세요.`
      : `나는 「${esc(cut(D[r.i].t))}」를, 실제 ${nm}${josa(nm,'은','는')} 「${esc(cut(D[st.ri].t))}」를 골랐어요. 나와 무엇을 더 중요하게 여겼는지가 달랐던 거예요.`;
    rows+=`<div class="hrow" id="possq"><span class="lb" style="background:none"></span><div><div class="thinkq">🤔 이 선택을 한다면 어떤 일이 벌어질까?<br><span>이 선택이 가져올 가능성과 어려움을 잠깐 생각해 보세요.</span></div><button class="btn" id="possbtn">생각했어요 · 가능성과 어려움 확인하기</button></div></div>
      <div id="possbox" class="hidden">${row('res','이 선택을 한다면',cards)}</div>
      <div id="realq2" class="hrow hidden"><span class="lb" style="background:none"></span><div><button class="btn" id="realbtn2">📜 실제 역사에서는 어떻게 되었을까? 확인하기</button></div></div>
      <div id="realbox2" class="hidden">${row('real','실제 역사에서는?',fmt(st.real))}${row('cmpr','비교해 보기',cmp+`<div class="hint" style="margin-top:4px">어느 쪽이 정답이라기보다, 당시 상황에서 무엇을 더 중요하게 여겼는지의 차이예요.</div>`)}</div>`;
  }
  else if(st.real) rows+= st.reveal? `<div id="realbox" class="hidden">${row('real','실제 역사에서는?',fmt(st.real))}</div><div class="hrow" id="realq"><span class="lb" style="background:none"></span><div><button class="btn" id="realbtn">🤔 실제 역사에서는 어떻게 되었을까? 확인하기</button></div></div>` : row('real','실제 역사에서는?',fmt(st.real));
  p.innerHTML=`<div class="hist"><div class="hhead">📜 ${st.title||'실제 역사에서는?'}</div>${rows}
    ${st.key?`<div class="key">「${st.key}」</div>`:''}</div>
    <div class="actions">${st.src&&SOURCES[st.src]&&SOURCES[st.src].length?'<button class="btn ghost" id="srcb">📜 당시 상황을 보여주는 사료</button>':''}${st.bonus?'<button class="btn ghost" id="bn">⭐ BONUS 사료 더 보기 (선택)</button>':''}<button class="btn primary" id="nx">다음 ▶</button></div>`;
  chime();
  $('#nx').onclick=next; if(st.bonus) $('#bn').onclick=openBonus; if($('#srcb')) $('#srcb').onclick=()=>openSources(st.src);
  if($('#possbtn')){ $('#nx').disabled=true; /* [v10] */
    $('#possbtn').onclick=()=>{ $('#possq').remove(); const b=$('#possbox'); b.classList.remove('hidden'); b.style.animation='pop .35s both'; $('#realq2').classList.remove('hidden'); tick(); };
    $('#realbtn2').onclick=()=>{ $('#realq2').remove(); const b=$('#realbox2'); b.classList.remove('hidden'); b.style.animation='pop .35s both'; $('#nx').disabled=false; chime(); }; }
  if($('#realbtn')){ $('#nx').disabled=true; $('#realbtn').onclick=()=>{ $('#realq').remove(); $('#realbox').classList.remove('hidden'); $('#realbox').style.animation='pop .35s both'; $('#nx').disabled=false; chime(); }; } /* [v9] */
};

/* 사료 찾기 활동: 원문 속 표현을 눌러 고르고, (필요하면) 한 문장 쓰기 */
R.find=st=>{
  /* [v7] 원문 읽기 → 사료에서 찾기 → (필요할 때만) 도움말 → 확인 질문 → 다음 */
  const F=st.find, C=st.checks||[];
  stage.innerHTML=`<div class="full"><div class="ttl"><div class="kicker">${st.kicker}</div><h2>${st.title}</h2><p>${fmt(st.intro)}</p></div>
  <div class="src">
    <div><div class="readfirst">📜 먼저 원문을 읽어보세요.</div>
      <div class="orig ${F?'pickable':''}"><h4>${st.doc.title}</h4><div class="src-meta">${st.doc.meta}</div>${st.doc.body}</div></div>
    <div class="q srcq"><div class="qlabel">${st.label}</div>
      ${F?`<div class="blk"><h4>👀 사료에서 찾아보세요</h4><div class="qq">${fmt(F.q)}</div><div class="mine" id="found">👆 원문에서 해당하는 표현을 눌러 보세요.</div></div>`:''}
      ${st.guide?`<div class="blk"><h4>${st.guide}</h4></div>`:''}
      ${st.help?`<div class="blk"><details class="help"><summary>💡 이해가 어렵다면 도움말 보기</summary><div>${st.help}</div></details></div>`:''}
      <div class="blk"><h4>📌 잠깐!</h4><div class="hint" style="margin:-2px 0 10px">이 사료의 내용을 확인한 뒤 다음으로 넘어가요.</div>
        ${C.map((c,ci)=>`<div class="chk" data-c="${ci}"><div class="qq">${C.length>1?`Q${ci+1}. `:''}${c.q}</div><div class="opts one">${c.opts.map((o,oi)=>`<button class="opt" data-o="${oi}"><span class="num">${NUMS[oi]}</span><span>${o}</span></button>`).join('')}</div><div class="fb"></div></div>`).join('')}
      </div>
      ${st.after?`<div class="verdict hidden" id="after">${fmt(st.after)}</div>`:''}
    </div>
  </div>${nextBtn(st.nextLabel||'다음 ▶',true)}</div>`;
  const nx=$('#nx'), chunks=$$('.orig .pk'); let pick=-1; const solved=C.map(()=>false);
  const flash=a=>{ const el=$(`.orig [data-a="${a}"]`); if(!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),2400); };
  const check=()=>{ const ok=(!F||pick>=0)&&solved.every(Boolean); nx.disabled=!ok; if(ok&&st.after) $('#after').classList.remove('hidden'); };
  const choose=i=>{ pick=i; chunks.forEach((m,j)=>m.classList.toggle('on',j===i)); $('#found').innerHTML=`<b>내가 찾은 표현:</b> 「${esc(chunks[i].textContent)}」`; check(); };
  chunks.forEach((m,i)=>m.onclick=()=>{tick();choose(i)});
  const markSolved=(ci,oi)=>{ const box=$(`.chk[data-c="${ci}"]`); solved[ci]=true;
    box.querySelectorAll('.opt').forEach(b=>{b.classList.toggle('ok',+b.dataset.o===oi);b.classList.remove('no');b.disabled=true});
    const fb=box.querySelector('.fb'); fb.className='fb ok'; fb.textContent='✔ '+(C[ci].ok||'맞아요! 원문에서 확인한 대로예요.'); };
  $$('.chk .opt').forEach(b=>b.onclick=()=>{
    const ci=+b.closest('.chk').dataset.c, oi=+b.dataset.o, c=C[ci];
    if(oi===c.a){ chime(); markSolved(ci,oi); flash(c.back); check(); }
    else { tick(); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); const fb=b.closest('.chk').querySelector('.fb'); fb.className='fb no'; fb.textContent='다시 생각해 봐요 — '+c.wrong; flash(c.back); }
  });
  const prev=S.rec[st.id];
  if(prev){ if(F&&prev.i>=0&&chunks[prev.i]) choose(prev.i); C.forEach((c,ci)=>markSolved(ci,c.a)); check(); }
  nx.onclick=()=>{
    const found=F&&pick>=0?chunks[pick].textContent:'';
    const ans=C.map(c=>plain(c.opts[c.a])).join(' / ');
    rec(st.id,{label:st.label,choice:found||ans,short:found||ans,i:pick,reason:found?('확인: '+ans):''});
    chime(); next();
  };
};

/* [v7] 사진 한 장 + 짧은 내레이션 장면 (사진이 없으면 그림으로 대신) */
R.photo=st=>{
  stage.innerHTML=`<div class="pro" id="pro" data-adv="1"><div id="pin" style="width:100%;display:flex;flex-direction:column;align-items:center"><div class="pvis" id="pv">${(VIS[st.vis]||(()=>''))()}${photoLayer(st.img)}</div>${st.cap?`<div class="photocap">${st.cap}</div>`:''}<div class="pnar"></div></div><div class="tap" id="tap"></div></div>`;
  const tap=$('#tap'); let ph=-1, can=false, tmr=null;
  const ready=(d=0)=>{clearTimeout(tmr);tmr=setTimeout(()=>{can=true;tap.textContent='화면을 눌러 계속 ▶'},d)};
  const phases=st.lines.map(t=>()=>typeText($('.pnar'),t,()=>ready(250),55));
  phases.push(()=>{tap.textContent=''; $('.pnar').innerHTML=`${st.final||''}<div style="margin-top:18px"><button class="btn primary big" id="go">${st.button||'다음 ▶'}</button></div>`; thud();
    $('#go').onclick=e=>{e.stopPropagation();next()}; $('#pro').removeAttribute('data-adv');});
  const adv=()=>{ if(T){T.finish();return} if(ph===-1||can){can=false;tap.textContent='';ph++; if(phases[ph]) phases[ph]();} };
  $('#pro').onclick=adv; setTimeout(adv,900);
};

/* [v4] SOURCES 사료 팝업 (BONUS 팝업과 같은 모양) */

  const draw=()=>{const b=list[cur];box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">📜 당시 상황을 보여주는 사료</b><button class="btn ghost" id="mc">닫기 ✕</button></div>
    ${list.length>1?`<div class="tabs">${list.map((x,i)=>`<button class="${i===cur?'on':''}" data-i="${i}">${x.t}</button>`).join('')}</div>`:'<div style="height:12px"></div>'}

function buildRoute(k){
  return ROUTES[k].steps.map(s=>{
    const o=Object.assign({part:s.t==='routeEnd'?4:3},s);
    if(o.id){ o.stage=+o.id.slice(1); o.id=`${k}_${o.id}`; } /* [v9] r1·r2·r3 → 단계 1·2·3 */
    if(o.ref) o.ref=`${k}_${o.ref}`;
    /* [v5] 딜레마(dl) → 장단점이 함께 보이는 선택지 */
    if(o.dl){ o.abc=1; o.opts=o.dl.map(d=>`<b>${d.t}</b>`); /* [v10] 선택 전에는 선택 문장만 (용어·장단점은 선택 뒤에) */ o.short=o.dl.map(d=>d.t); }
    return o;
  }).map((o,i,arr)=>{
    if(o.t==='history'&&o.ref&&!o.res){ const ch=arr[i-1]; if(ch&&ch.dl){ o.dlr=ch.dl; o.ri=ch.ri; o.who=k; o.title=o.title||'나의 선택 → 실제 역사에서는?'; o.reveal=1; /* [v10] */ } }
    if(!o.bg){ const prev=arr.slice(0,i).reverse().find(x=>x.bg); if(prev){o.bg=prev.bg;o.night=prev.night;o.banner=prev.banner;o.place=o.place||prev.place;o.date=o.date||prev.date;o.chars=o.chars||prev.chars;} }
    return o;
  });
}

  {t:'final2',part:4},
  {t:'ending',part:4}
];

/* ================= 키보드 ================= */
document.addEventListener('keydown',e=>{
  if($('#modal').classList.contains('open')){ if(e.key==='Escape') $('#modal').classList.remove('open'); return; }
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){
    const a=$('[data-adv]'); const nx=$('#nx');
    if(a){e.preventDefault();a.click()}
    else if(nx&&!nx.disabled){e.preventDefault();nx.click()}
  }
});
